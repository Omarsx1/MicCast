name: Build & Release MicCast

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Gradle
        run: |
          # Si no existe gradlew, se instala gradle o se genera el wrapper
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Compilar APK de Android
        run: ./gradlew :app:assembleDebug

      - name: Renombrar APK para Release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/MicCast-Android.apk

      - name: Subir artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: MicCast-Android-APK
          path: release-artifacts/MicCast-Android.apk

  build-macos:
    name: Compilar App macOS (Universal arm64 + Intel)
    runs-on: macos-14
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Compilar binario nativo de macOS
        run: |
          cd macos
          # Compilar binario universal compatible con Apple Silicon (M1/M2/M3) e Intel
          swift build -c release --arch arm64 --arch x86_64
          
          # Crear estructura del paquete .app
          APP="MicCast.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          
          cp .build/apple/Products/Release/MicCastMac "$APP/Contents/MacOS/MicCast"
          chmod +x "$APP/Contents/MacOS/MicCast"
          
          if [ -f "MicCast/Info.plist" ]; then
            cp MicCast/Info.plist "$APP/Contents/Info.plist"
          fi
          
          # Firma ad-hoc
          codesign --force --deep -s - "$APP"
          
          # Empaquetar en ZIP para descarga directa
          zip -r -y ../MicCast-macOS.zip "$APP"

      - name: Subir artefacto macOS
        uses: actions/upload-artifact@v4
        with:
          name: MicCast-macOS-ZIP
          path: MicCast-macOS.zip

  publish-release:
    name: Publicar Release en GitHub
    needs: [build-android, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar APK Android
        uses: actions/download-artifact@v4
        with:
          name: MicCast-Android-APK
          path: ./downloads

      - name: Descargar App macOS
        uses: actions/download-artifact@v4
        with:
          name: MicCast-macOS-ZIP
          path: ./downloads

      - name: Publicar GitHub Release con los 2 Compilados
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: MicCast ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🎙️ MicCast Release

            Convierte tu teléfono Android en un micrófono inalámbrico (Wi-Fi) y por cable (USB) de ultrabaja latencia para macOS.

            ### 📦 Descargas incluidas:
            1. 📱 **`MicCast-Android.apk`**: Instálalo en tu teléfono Android (Android 8.0 o superior).
            2. 🍏 **`MicCast-macOS.zip`**: Descomprímelo en tu Mac y arrastra `MicCast.app` a tu carpeta de Aplicaciones (compatible con Apple Silicon e Intel).

            ### 🚀 Instrucciones rápidas:
            - **En macOS:** Instala BlackHole (`brew install blackhole-2ch`) y abre `MicCast.app`.
            - **En Android:** Abre `MicCast`, detectará tu Mac automáticamente en la red Wi-Fi o toca *Emparejar* e introduce el PIN.
          files: |
            ./downloads/MicCast-Android.apk
            ./downloads/MicCast-macOS.zip
