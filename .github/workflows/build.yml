name: Build artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the artifact names (e.g. 1.1.0)"
        required: true
        default: "1.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "MicCast-Android-${{ needs.version.outputs.value }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MicCast-Android-APK
          path: MicCast-Android-*.apk
          if-no-files-found: error

  macos:
    name: macOS DMG
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal DMG
        run: |
          cd app/applet/macos
          bash package_release.sh "${{ needs.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: MicCast-macOS-DMG
          path: |
            app/applet/macos/dist/*.dmg
            app/applet/macos/dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
